<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sistema de Gestión — Juguetería{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f4f5f7; }
  .navbar-brand { font-weight:700; }
  .card { border:none; box-shadow:0 1px 4px rgba(0,0,0,.08); border-radius:10px; }
  .badge-ok{background:#3FAA9B;} .badge-bajo{background:#DDAF3C;} .badge-sin{background:#E2685A;}
  footer{color:#8a8a8a; font-size:.8rem;}
</style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#5089C4;">
  <div class="container">
    <span class="navbar-brand">🧸 Sistema de Gestión — Juguetería</span>
    <span class="text-white-50 small">Módulo: Depósito — Carga de Productos</span>
  </div>
</nav>
<div class="container my-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
  <footer class="text-center mt-5 mb-3">Trabajo Práctico Anual 2026 — Modelos y Sistemas II — Sistema de Gestión para Juguetería</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
