{% extends "productos/base.html" %}
{% block title %}Registrar Achique — Juguetería{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3 text-warning">💸 Registrar Achique (Retiro de Efectivo)</h3>
      <p class="text-muted">Retiro de dinero de la caja por un motivo distinto a una venta.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning w-100">Registrar Achique</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{% url 'caja_dashboard' %}" class="btn btn-secondary btn-sm">Volver al Punto de Venta</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
